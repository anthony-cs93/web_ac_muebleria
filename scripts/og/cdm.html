<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
body{ background:#2E2F1A; color:#F7F2E6; font-family:'Jost',sans-serif; }
.photo{ position:absolute; right:0; top:0; width:470px; height:630px; background:#E9DEC8 url('../../public/cdm/hero.png') -470px 0 / auto 630px no-repeat; }
.photo::before{ content:""; position:absolute; left:-1px; top:0; bottom:0; width:70px; background:linear-gradient(90deg,#2E2F1A,rgba(46,47,26,0)); }
.logo{ position:absolute; left:64px; top:56px; width:290px; }
h1{ position:absolute; left:72px; top:228px; width:640px; font-family:'Playfair Display',serif; font-weight:600; font-size:56px; line-height:1.14; }
h1 em{ font-style:italic; font-weight:500; color:#E1CBA2; }
.sub{ position:absolute; left:72px; bottom:58px; display:flex; align-items:center; gap:18px; font-size:24px; letter-spacing:.14em; text-transform:uppercase; color:rgba(225,203,162,.85); }
.sub::before{ content:""; width:56px; height:2px; background:#E1CBA2; }
</style></head>
<body>
<div class="photo"></div>
<img class="logo" src="../../public/cdm/logo.png" alt="">
<h1>Regalos que dicen lo que las palabras <em>no alcanzan.</em></h1>
<div class="sub">Detalles personalizados en madera</div>
</body></html>
